<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">

  <title>Profile card component</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <article class="profile-card">
      <div class="profile-card__header"></div>

      <img class="profile-card__avatar" src="./images/image-victor.jpg" alt="Portrait of Victor Crest">

      <div class="profile-card__details">
        <h1 class="profile-card__name">Victor Crest <span class="profile-card__age">26</span></h1>
        <p class="profile-card__location">London</p>
      </div>

      <ul class="profile-card__stats">
        <li class="stat">
          <span class="stat__value">80K</span>
          <span class="stat__label">Followers</span>
        </li>
        <li class="stat">
          <span class="stat__value">803K</span>
          <span class="stat__label">Likes</span>
        </li>
        <li class="stat">
          <span class="stat__value">1.4K</span>
          <span class="stat__label">Photos</span>
        </li>
      </ul>
    </article>
  </main>
</body>
</html>
